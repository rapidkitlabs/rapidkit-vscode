name: release-extension

on:
  workflow_dispatch:
    inputs:
      smoke_run_id:
        description: 'Successful extension-smoke-matrix run id that uploaded the VSIX artifact'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA tested by extension-smoke-matrix and used in the VSIX artifact name'
        required: true
        type: string
      publish_target:
        description: 'Use dry-run to verify gates without publishing'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - marketplace

permissions:
  contents: read
  actions: read

concurrency:
  group: release-extension-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  publish-from-inspected-vsix:
    name: Publish from inspected VSIX artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: corepack npm ci

      - name: Resolve and verify the pinned Workspai CLI package
        run: |
          CLI_VERSION=$(node -p "require('./contracts/extension-cli-release-policy.v1.json').verifiedCliVersion")
          npm view "workspai@${CLI_VERSION}" version

      - name: Validate Discord release announcement
        run: npm run release:discord:check

      - name: Download inspected VSIX artifact from smoke matrix
        uses: actions/download-artifact@v4
        with:
          name: workspai-vsix-${{ inputs.commit_sha }}
          run-id: ${{ inputs.smoke_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Re-inspect downloaded VSIX
        run: npm run smoke:vsix-artifact

      - name: Guard publish provenance
        env:
          WORKSPAI_EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          WORKSPAI_VSIX_ARTIFACT_NAME: workspai-vsix-${{ inputs.commit_sha }}
        run: npm run publish:guard

      - name: Publish to VS Code Marketplace
        if: inputs.publish_target == 'marketplace'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          WORKSPAI_EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          WORKSPAI_VSIX_ARTIFACT_NAME: workspai-vsix-${{ inputs.commit_sha }}
        run: npm run publish:ci

      - name: Dry-run summary
        if: inputs.publish_target == 'dry-run'
        run: |
          echo "Dry-run complete. VSIX artifact passed provenance and content gates."
          echo "Commit: ${{ inputs.commit_sha }}"
          echo "Artifact: workspai-vsix-${{ inputs.commit_sha }}"

      - name: Refresh Workspai changelog cache
        if: inputs.publish_target == 'marketplace'
        continue-on-error: true
        env:
          WORKSPAI_CHANGELOG_WEBHOOK_URL: ${{ secrets.WORKSPAI_CHANGELOG_WEBHOOK_URL }}
          WORKSPAI_CHANGELOG_WEBHOOK_SECRET: ${{ secrets.WORKSPAI_CHANGELOG_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WORKSPAI_CHANGELOG_WEBHOOK_URL:-}" ] || [ -z "${WORKSPAI_CHANGELOG_WEBHOOK_SECRET:-}" ]; then
            echo "::warning::Workspai changelog webhook is not configured (need secrets.WORKSPAI_CHANGELOG_WEBHOOK_URL and secrets.WORKSPAI_CHANGELOG_WEBHOOK_SECRET)."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "Requesting Workspai changelog revalidation for vscode@${VERSION}..."
          curl -fsS -X POST "${WORKSPAI_CHANGELOG_WEBHOOK_URL}" \
            -H "Authorization: Bearer ${WORKSPAI_CHANGELOG_WEBHOOK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"source\":\"vscode\",\"version\":\"${VERSION}\"}"
          echo "Workspai changelog cache refresh requested."
